<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>MediSphere — Complete Healthcare in One Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#FAFAF7;
  --surface:#FFFFFF;
  --surface-tint:#EFF5F3;
  --ink:#16211D;
  --ink-soft:#57655D;
  --ink-faint:#8B968F;
  --teal:#0E6E62;
  --teal-deep:#0A4C44;
  --teal-pale:#E1F0EC;
  --coral:#E1503A;
  --coral-deep:#B93A28;
  --coral-pale:#FBE6E2;
  --gold:#C98A2A;
  --gold-pale:#FBF0DE;
  --line:#E6E3D9;
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-sm:0 2px 8px rgba(15,40,34,0.06);
  --shadow-md:0 8px 24px rgba(15,40,34,0.10);
  --shadow-lg:0 16px 40px rgba(15,40,34,0.16);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  background:#DDE6E2;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;
  justify-content:center;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}

/* ============ APP SHELL (phone frame) ============ */
#device{
  width:430px;
  max-width:100vw;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  overflow-x:hidden;
  box-shadow:var(--shadow-lg);
  display:flex;
  flex-direction:column;
}
#app{
  flex:1;
  display:flex;
  flex-direction:column;
  padding-bottom:0;
}
.screen{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  animation:slideIn .32s cubic-bezier(.22,.68,.36,1);
}
@keyframes slideIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
.screen.with-nav{min-height:calc(100vh - 76px);}

/* ============ TYPE ============ */
h1,h2,h3,.display{font-family:var(--font-display); color:var(--ink); font-weight:700; letter-spacing:-0.01em;}
.eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal); font-weight:600;}
.mono{font-family:var(--font-mono);}
p{color:var(--ink-soft); line-height:1.5;}

/* ============ TOP BAR ============ */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 20px 8px;
}
.topbar .back-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm); cursor:pointer; font-size:18px; border:none; color:var(--ink);
}
.topbar .title{font-family:var(--font-display); font-weight:600; font-size:17px;}
.topbar .icon-btn{
  width:38px;height:38px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm); cursor:pointer; font-size:16px; border:none; position:relative;
}
.badge-dot{position:absolute; top:6px; right:7px; width:8px; height:8px; border-radius:50%; background:var(--coral); border:2px solid var(--surface);}

/* ============ BUTTONS ============ */
.btn{
  font-family:var(--font-body); font-weight:600; font-size:15px;
  border:none; border-radius:14px; padding:16px 20px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  width:100%;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal); color:#fff; box-shadow:0 6px 16px rgba(14,110,98,0.28);}
.btn-primary:hover{background:var(--teal-deep);}
.btn-secondary{background:var(--teal-pale); color:var(--teal-deep);}
.btn-ghost{background:transparent; color:var(--teal-deep); border:1.5px solid var(--line);}
.btn-coral{background:var(--coral); color:#fff; box-shadow:0 6px 16px rgba(225,80,58,0.28);}
.btn-coral:hover{background:var(--coral-deep);}
.btn-sm{padding:10px 14px; font-size:13px; border-radius:10px; width:auto;}
.btn-block-row{display:flex; gap:10px;}
.btn:disabled{opacity:0.5; cursor:not-allowed;}

/* ============ CARDS / SURFACES ============ */
.card{
  background:var(--surface); border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm); padding:16px; border:1px solid rgba(230,227,217,0.7);
}
.section{padding:0 20px 20px;}
.section-title{font-family:var(--font-display); font-size:20px; font-weight:700; margin-bottom:4px;}
.section-sub{color:var(--ink-soft); font-size:14px; margin-bottom:16px;}

/* ============ FORMS ============ */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:13px 14px;
  font-family:var(--font-body); font-size:14.5px; color:var(--ink); background:var(--surface);
  transition:border-color .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--teal);}
.field-error{border-color:var(--coral) !important;}
.error-msg{color:var(--coral-deep); font-size:12px; margin-top:5px; display:none;}
.field-hint{font-size:12px; color:var(--ink-faint); margin-top:5px;}

/* ============ MISC UI ============ */
.chip{
  display:inline-flex; align-items:center; padding:7px 13px; border-radius:100px;
  background:var(--teal-pale); color:var(--teal-deep); font-size:13px; font-weight:600;
  cursor:pointer; border:1.5px solid transparent; white-space:nowrap;
}
.chip.active{background:var(--teal); color:#fff;}
.chip.coral{background:var(--coral-pale); color:var(--coral-deep);}
.chip.coral.active{background:var(--coral); color:#fff;}
.tag{font-size:11px; font-weight:700; padding:4px 9px; border-radius:100px; display:inline-flex; align-items:center; gap:4px;}
.tag-open{background:var(--teal-pale); color:var(--teal-deep);}
.tag-closed{background:#F0EDE4; color:var(--ink-faint);}
.tag-gold{background:var(--gold-pale); color:var(--gold);}
.divider{height:1px; background:var(--line); margin:16px 0;}
.avatar{width:52px; height:52px; border-radius:16px; background:var(--teal-pale); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0;}
.avatar.round{border-radius:50%;}
.stack-gap-8 > * + *{margin-top:8px;}
.stack-gap-12 > * + *{margin-top:12px;}
.stack-gap-16 > * + *{margin-top:16px;}
.row{display:flex; align-items:center;}
.row-between{display:flex; align-items:center; justify-content:space-between;}
.grow{flex:1;}
.searchbar{
  display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1.5px solid var(--line); border-radius:14px; padding:13px 16px; box-shadow:var(--shadow-sm);
}
.searchbar input{border:none; outline:none; flex:1; font-family:var(--font-body); font-size:14.5px; background:transparent;}

/* Departure-board token digit — signature element */
.token-board{
  display:inline-flex; gap:3px; font-family:var(--font-mono); font-weight:700;
}
.token-digit{
  background:var(--teal-deep); color:#EAF5F2; border-radius:6px; padding:4px 2px;
  min-width:26px; text-align:center; font-size:20px; box-shadow:inset 0 -2px 0 rgba(0,0,0,0.2);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1), background .35s ease;
}
.token-digit.flip{animation:flipDigit .4s ease;}
@keyframes flipDigit{
  0%{transform:rotateX(0deg);} 45%{transform:rotateX(90deg); background:var(--teal);} 100%{transform:rotateX(0deg);}
}
.token-digit.lg{font-size:34px; padding:8px 6px; min-width:38px; border-radius:9px;}

/* Toast */
#toast-wrap{position:absolute; top:14px; left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:999; pointer-events:none; padding:0 16px;}
.toast{
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:100px; font-size:13.5px; font-weight:500;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px; max-width:100%;
  animation:toastIn .28s ease, toastOut .3s ease 2.7s forwards;
}
@keyframes toastIn{from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);}}
@keyframes toastOut{to{opacity:0; transform:translateY(-12px);}}

/* Bottom nav */
#bottomnav{
  position:sticky; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--line); display:flex; z-index:50;
  box-shadow:0 -4px 16px rgba(15,40,34,0.06);
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:11px 0 10px; cursor:pointer; border:none; background:none; font-family:var(--font-body);
  color:var(--ink-faint); font-size:11px; font-weight:600; position:relative;
}
.nav-item.active{color:var(--teal-deep);}
.nav-item .nav-ico{font-size:19px;}
.nav-item .nav-dot{position:absolute; top:6px; right:calc(50% - 18px); width:7px; height:7px; border-radius:50%; background:var(--coral);}

/* Service cards grid */
.service-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:0 20px 20px;}
.service-card{
  background:var(--surface); border-radius:20px; padding:18px 16px; box-shadow:var(--shadow-sm);
  border:1px solid rgba(230,227,217,0.7); cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
  text-align:left; display:flex; flex-direction:column; gap:10px; min-height:150px;
}
.service-card:active{transform:scale(0.96);}
.service-card .ico-wrap{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px;}
.service-card h3{font-size:15.5px; font-family:var(--font-display);}
.service-card p{font-size:12px; line-height:1.4;}

/* Loading spinner */
.spinner{width:20px; height:20px; border-radius:50%; border:3px solid rgba(255,255,255,0.35); border-top-color:#fff; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-row{display:flex; align-items:center; justify-content:center; gap:10px; padding:30px 0; color:var(--ink-soft); font-size:14px;}
.dot-pulse{display:flex; gap:5px;}
.dot-pulse span{width:7px; height:7px; border-radius:50%; background:var(--teal); animation:pulse 1s infinite ease-in-out;}
.dot-pulse span:nth-child(2){animation-delay:.15s;} .dot-pulse span:nth-child(3){animation-delay:.3s;}
@keyframes pulse{0%,80%,100%{opacity:.25; transform:scale(.7);} 40%{opacity:1; transform:scale(1);}}

/* progress bar for queue */
.progress-track{height:8px; background:var(--teal-pale); border-radius:100px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--teal-deep)); border-radius:100px; transition:width .6s ease;}

/* checkbox / tab pills */
.tabs{display:flex; background:var(--surface-tint); border-radius:14px; padding:4px; gap:4px;}
.tab-btn{flex:1; border:none; background:transparent; padding:11px 0; border-radius:11px; font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--ink-soft); cursor:pointer;}
.tab-btn.active{background:var(--surface); color:var(--teal-deep); box-shadow:var(--shadow-sm);}

/* category grid */
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.cat-card{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; text-align:center; transition:border-color .15s;}
.cat-card:active{border-color:var(--teal);}
.cat-card .cat-ico{font-size:26px; margin-bottom:8px;}
.cat-card span{font-size:13px; font-weight:600;}

.empty-state{text-align:center; padding:50px 24px; color:var(--ink-faint);}
.empty-state .ico{font-size:40px; margin-bottom:14px;}

::-webkit-scrollbar{display:none;}
a{color:inherit;}
button{font-family:var(--font-body);}
</style>
</head>
<body>
<div id="device">
  <div id="toast-wrap"></div>
  <div id="app"></div>
  <div id="bottomnav" style="display:none;"></div>

  {id:'b2', name:'Red Cross Blood Center', distance:'4.1 KM', open:true, address:'Cubbon Park Road', phone:'080-2211-3300', hours:'8:00 AM – 8:00 PM', stock:{'A+':true,'A-':true,'B+':false,'B-':false,'AB+':true,'AB-':false,'O+':true,'O-':false}},

];

const RECORD_CATS = [
  {id:'presc', name:'Prescriptions', ico:'📄'},

/* ---------- STATE ---------- */
const state = {
  user:{name:'', email:'', phone:''},
  profile:{},
  authTab:'login',
  stack:[{screen:'welcome', params:{}}],
  showNav:false,
  runningTokenByDoctor:{d1:5,d2:3,d3:2,d4:6,d5:4,d6:1,d7:8,d8:3,d9:2,d10:2,d11:5,d12:4,d13:3,d14:1,d15:2,d16:4},

  bookings:[],
  records:[
    {id:'r1', name:'Blood Test Report', cat:'blood', hospital:'City Care Hospital', doctor:'Dr. Ravi Kumar', date:'12 Aug 2026', uploaded:'12 Aug 2026', notes:'Routine annual checkup'},
    {id:'r2', name:'Chest X-Ray', cat:'xray', hospital:'Apollo Health Center', doctor:'Dr. Suresh Menon', date:'03 Jul 2026', uploaded:'03 Jul 2026', notes:'Post fracture follow-up'},
  ],
  notifications:[
    {ico:'🎟️', text:'Token 7 is currently running. Your appointment is approaching.', time:'2 min ago', unread:true},
    {ico:'💊', text:'HealthPlus Medical Store responded to your medicine inquiry.', time:'1 hr ago', unread:true},
    {ico:'🩸', text:'City Blood Bank has updated O+ availability.', time:'3 hr ago', unread:false},
    {ico:'📁', text:'Your Blood Test Report was successfully uploaded.', time:'Yesterday', unread:false},
  ],
  medicineQuery:'',
  bloodGroup:null,
};

function unreadCount(){ return state.notifications.filter(n=>n.unread).length; }

/* ---------- NAV ---------- */
function nav(screen, params={}){
  state.stack.push({screen, params});
  render();
  window.scrollTo(0,0);
}
function navReplace(screen, params={}){
  state.stack[state.stack.length-1] = {screen, params};
  render();
}
function navRoot(screen, params={}){
  state.stack = [{screen, params}];
  render();
}
function back(){
  if(state.stack.length>1){ state.stack.pop(); render(); window.scrollTo(0,0); }
}
function current(){ return state.stack[state.stack.length-1]; }

/* ---------- TOAST ---------- */
function toast(text, ico='✅'){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span>${ico}</span><span>${text}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3050);
}

/* ---------- SHARED UI HELPERS ---------- */
function topbar(title, {back:showBack=true, icons=true}={}){
  return `<div class="topbar">
    ${showBack ? `<button class="back-btn" onclick="back()">←</button>` : `<div style="width:38px"></div>`}
    <div class="title">${title}</div>
    ${icons ? `<button class="icon-btn" onclick="nav('notifications')">🔔${unreadCount()>0?'<span class="badge-dot"></span>':''}</button>` : `<div style="width:38px"></div>`}
  </div>`;
}
function stars(rating){
  return `<span class="tag tag-gold">⭐ ${rating}</span>`;
}
function statusTag(open){
  return open ? `<span class="tag tag-open">🟢 Open Now</span>` : `<span class="tag tag-closed">⚪ Closed</span>`;
}
function tokenBoard(num, size=''){
  const digits = String(num).padStart(2,'0').split('');
  return `<span class="token-board">${digits.map(d=>`<span class="token-digit ${size}">${d}</span>`).join('')}</span>`;
}
function fieldError(inputId, msgId, show, msg){
  const inp = document.getElementById(inputId);
  const em = document.getElementById(msgId);
  if(!inp) return;
  if(show){ inp.classList.add('field-error'); if(em){em.style.display='block'; if(msg) em.textContent=msg;} }
  else { inp.classList.remove('field-error'); if(em) em.style.display='none'; }
}

const NAV_SCREENS = ['dashboard','notifications','recordsHome','profile'];

    {id:'recordsHome', ico:'📁', label:'Records'},

}

function doLogin(){
  const user = val('li-user'), pass = val('li-pass');
  let ok = true;
  if(!user){ fieldError('li-user','li-user-err',true); ok=false; } else fieldError('li-user','li-user-err',false);
  if(!pass){ fieldError('li-pass','li-pass-err',true); ok=false; } else fieldError('li-pass','li-pass-err',false);
  if(!ok) return;
  state.user.name = state.user.name || 'Pavan';
  state.user.email = user.includes('@') ? user : state.user.email;
  state.user.phone = !user.includes('@') ? user : state.user.phone;
  toast('Logged in successfully','✅');
  navRoot('profileSetup');
}
function doSignup(){
  const name=val('su-name'), email=val('su-email'), mobile=val('su-mobile'), pass=val('su-pass'), cpass=val('su-cpass');
  let ok = true;
  if(!name){ fieldError('su-name','su-name-err',true); ok=false; } else fieldError('su-name','su-name-err',false);
  const emailOk = /^\S+@\S+\.\S+$/.test(email);
  if(!emailOk){ fieldError('su-email','su-email-err',true); ok=false; } else fieldError('su-email','su-email-err',false);
  const mobileOk = /^\d[\d\s]{8,}\d$/.test(mobile.replace(/\s/g,'')) && mobile.replace(/\D/g,'').length===10;
  if(!mobileOk){ fieldError('su-mobile','su-mobile-err',true); ok=false; } else fieldError('su-mobile','su-mobile-err',false);
  if(!pass || pass.length<6){ fieldError('su-pass','su-pass-err',true); ok=false; } else fieldError('su-pass','su-pass-err',false);
  if(!cpass || cpass!==pass){ fieldError('su-cpass','su-cpass-err',true); ok=false; } else fieldError('su-cpass','su-cpass-err',false);
  if(!ok) return;
  state.user = {name, email, phone:mobile};
  toast('Account created successfully','🎉');
  navRoot('profileSetup');
}

const TIME_SLOTS = ['09:00 AM','10:30 AM','12:00 PM','02:30 PM','04:00 PM','06:30 PM'];
function nextDates(n){
  const out=[]; const today=new Date();
  for(let i=0;i<n;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    const label = i===0?'Today': i===1?'Tomorrow': d.toLocaleDateString('en-US',{weekday:'short'});
    out.push({iso:d.toISOString().slice(0,10), label, day:d.getDate(), full:d.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'})});
  }
  return out;
}

/* ================= LIVE TOKEN SIMULATION ================= */
setInterval(()=>{
  let touchedActiveDoctor = null;
  state.bookings.filter(b=>b.status==='active').forEach(b=>{
    const running = state.runningTokenByDoctor[b.doctorId];
    if(running < b.token){
      state.runningTokenByDoctor[b.doctorId] = running + 1;
      const newRunning = state.runningTokenByDoctor[b.doctorId];
      touchedActiveDoctor = b.doctorId;
      if(b.reminderToken && !b.reminderFired && newRunning >= b.reminderToken){
        b.reminderFired = true;
        state.notifications.unshift({ico:'🎟️', text:`Token ${b.reminderToken} is currently running. Your Token: ${b.token}. Please prepare to reach the hospital.`, time:'Just now', unread:true});
        toast(`🔔 Token ${b.reminderToken} is running — get ready!`, '🎟️');
      }
      if(newRunning >= b.token){
        b.status='completed';
      }
    }
  });
  const screenNow = current().screen;
  if(touchedActiveDoctor && ['liveToken','dashboard','bookToken','doctors'].includes(screenNow)){
    render();
  } else if(screenNow==='notifications' || screenNow==='profile' || screenNow==='recordsHome'){
    renderBottomNav();
  }
}, 4000);

/* ================= INIT ================= */
render();
